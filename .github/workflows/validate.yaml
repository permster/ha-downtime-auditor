name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - name: Install the frontend version matching the installed HA core
        run: |
          pip install "$(python -c 'import json, pathlib, homeassistant.components.frontend as f; print(json.loads((pathlib.Path(f.__file__).parent / "manifest.json").read_text())["requirements"][0])')"
      - run: pytest -q

  # Notes for an upcoming release go in docs/release-notes/unreleased.md; the Release workflow
  # renames it to <version>.md. A released version's notes file stays as it was released.
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Released notes are unchanged
        run: |
          bad=0
          for f in docs/release-notes/[0-9]*.md; do
            v=$(basename "$f" .md)
            git cat-file -e "v$v:$f" 2>/dev/null || continue  # not released yet, or notes added after the release
            if ! git diff --quiet "v$v" -- "$f"; then
              echo "::error file=$f::v$v is already released; put new notes in docs/release-notes/unreleased.md"
              bad=1
            fi
          done
          exit $bad
